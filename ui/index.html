<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DSH Log Viewer</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.9/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans SC', sans-serif;
      background: #0f1117;
      color: #e1e4e8;
      min-height: 100vh;
      padding: 16px 24px;
    }
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .header h1 { font-size: 20px; font-weight: 600; color: #58a6ff; }
    .header .subtitle { font-size: 12px; color: #8b949e; }

    /* Upload */
    .upload-area {
      border: 1px dashed #30363d; border-radius: 8px; padding: 8px 14px;
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
      cursor: pointer; transition: all 0.2s; margin-bottom: 12px; background: #161b22;
    }
    .upload-area:hover, .upload-area.dragover { border-color: #58a6ff; background: #1a2332; }
    .upload-area .text { font-size: 13px; color: #c9d1d9; }
    .upload-area .hint { font-size: 12px; color: #484f58; }
    .upload-area .grow { flex: 1; min-width: 120px; }
    .upload-btn {
      padding: 5px 12px; border: none; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .btn-blue { background: #58a6ff; color: #fff; }
    .btn-green { background: #238636; color: #fff; }
    .btn-green:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-outline { background: transparent; border: 1px solid #30363d; color: #c9d1d9; }
    .btn-outline:hover { border-color: #58a6ff; color: #58a6ff; }
    .btn-orange { background: #d29922; color: #fff; }
    #fileInput { display: none; }

    /* Summary Cards - compact */
    .summary-cards { display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
    .card {
      background: #161b22; border: 1px solid #30363d; border-radius: 8px;
      padding: 10px 16px; flex: 1; min-width: 100px;
    }
    .card .label { font-size: 11px; color: #8b949e; text-transform: uppercase; letter-spacing: 0.5px; }
    .card .value { font-size: 22px; font-weight: 700; margin-top: 2px; }
    .card .value.error { color: #f85149; }
    .card .value.warn { color: #d29922; }
    .card .value.info { color: #58a6ff; }
    .card .value.success { color: #3fb950; }
    .card .extra { font-size: 11px; color: #484f58; }

    /* Main layout: charts row small + log area big */
    .main-layout {
      display: flex; gap: 14px; align-items: flex-start;
    }
    .charts-column {
      flex: 0 0 380px; display: flex; flex-direction: column; gap: 12px;
    }
    .log-column { flex: 1; min-width: 0; }

    /* Panel */
    .panel {
      background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 12px 14px;
    }
    .panel h3 {
      font-size: 13px; font-weight: 600; color: #c9d1d9; margin-bottom: 8px;
      display: flex; align-items: center; gap: 6px;
    }
    .panel h3 .badge { font-size: 10px; background: #30363d; color: #8b949e; padding: 1px 6px; border-radius: 8px; }

    /* Chart containers - smaller */
    .chart-sm { position: relative; height: 120px; }
    .chart-xs { position: relative; height: 100px; }

    /* AI Panel */
    .ai-panel {
      background: #161b22; border: 1px solid #30363d; border-radius: 8px;
      padding: 12px 14px; margin-bottom: 12px;
    }
    .ai-panel h3 { font-size: 13px; font-weight: 600; color: #c9d1d9; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
    .ai-panel .badge.llm { background: #23863655; color: #3fb950; font-size: 10px; padding: 1px 6px; border-radius: 8px; }
    .ai-panel .badge.rules { background: #d2992233; color: #d29922; font-size: 10px; padding: 1px 6px; border-radius: 8px; }
    #aiReport {
      white-space: pre-wrap; font-size: 12px; line-height: 1.6; color: #e1e4e8;
      max-height: 200px; overflow-y: auto;
    }
    #aiStatus { font-size: 11px; color: #8b949e; margin-bottom: 6px; }

    /* Chat Panel — AI 问答 */
    .chat-panel {
      background: #161b22; border: 1px solid #30363d; border-radius: 8px;
      padding: 10px 14px; margin-bottom: 12px;
    }
    .chat-panel .chat-toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
    .chat-panel .chat-toolbar .sel-count { font-size: 12px; color: #8b949e; }
    .chat-panel input[type="text"] {
      flex: 1; background: #0d1117; border: 1px solid #30363d; color: #c9d1d9;
      padding: 6px 10px; border-radius: 6px; font-size: 13px;
    }
    .chat-panel input[type="text"]:focus { outline: none; border-color: #58a6ff; }
    #chatAnswer {
      white-space: pre-wrap; font-size: 12px; line-height: 1.6; color: #e1e4e8;
      max-height: 250px; overflow-y: auto; background: #0d1117;
      border: 1px solid #21262d; border-radius: 6px; padding: 8px 12px;
      display: none;
    }

    /* Trace Panel */
    .trace-panel { margin-bottom: 12px; }
    .trace-panel select {
      background: #0d1117; border: 1px solid #30363d; color: #c9d1d9;
      padding: 4px 8px; border-radius: 4px; font-size: 12px; max-width: 100%;
    }
    .trace-view {
      background: #0d1117; border: 1px solid #21262d; border-radius: 6px;
      padding: 8px; max-height: 300px; overflow-y: auto; margin-top: 6px;
      font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 11px; line-height: 1.5;
      display: none;
    }

    /* Log viewer controls */
    .log-controls {
      display: flex; gap: 6px; margin-bottom: 6px; flex-wrap: wrap; align-items: center;
    }
    .log-controls input, .log-controls select {
      background: #0d1117; border: 1px solid #30363d; color: #c9d1d9;
      padding: 4px 8px; border-radius: 4px; font-size: 12px;
    }
    .log-controls input:focus, .log-controls select:focus { outline: none; border-color: #58a6ff; }
    .log-controls input.search-input { flex: 1; min-width: 120px; }

    /* Log viewer - BIG */
    .log-viewer {
      background: #0d1117; border: 1px solid #30363d; border-radius: 6px;
      padding: 8px; max-height: 70vh; overflow-y: auto;
      font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
      font-size: 11px; line-height: 1.5;
    }
    .log-line {
      display: flex; align-items: flex-start; gap: 4px;
      white-space: pre-wrap; word-break: break-all; padding: 1px 0;
    }
    .log-line:hover { background: #1a2332; }
    .log-line .cb { flex: 0 0 16px; margin-top: 2px; }
    .log-line .cb input { cursor: pointer; }
    .log-line .content { flex: 1; min-width: 0; }
    .log-line .ts { color: #8b949e; }
    .log-line .thread { color: #79c0ff; }
    .log-line .level-TRACE { color: #484f58; }
    .log-line .level-DEBUG { color: #7ee787; }
    .log-line .level-INFO { color: #58a6ff; }
    .log-line .level-WARN { color: #d29922; }
    .log-line .level-ERROR { color: #f85149; font-weight: 600; }
    .log-line .level-FATAL { color: #f85149; font-weight: 700; text-decoration: underline; }
    .log-line .logger { color: #bc8cff; }
    .log-line .msg { color: #e1e4e8; }
    .log-line.stacktrace { color: #8b949e; padding-left: 12px; font-size: 10px; }
    .log-line.selected { background: #23863622; outline: 1px solid #23863655; }
    .log-line .trace-tag {
      display: inline-block; font-size: 9px; background: #1f6feb33; color: #58a6ff;
      padding: 0 4px; border-radius: 3px; margin-left: 4px; cursor: pointer;
    }

    /* Exception list compact */
    .exception-list { list-style: none; font-size: 12px; max-height: 140px; overflow-y: auto; }
    .exception-item { padding: 3px 0; display: flex; justify-content: space-between; align-items: center; }
    .exception-item .class-name { font-family: monospace; color: #f85149; font-size: 11px; word-break: break-all; flex: 1; }
    .exception-item .count-badge { background: #f8514933; color: #f85149; font-size: 10px; padding: 1px 6px; border-radius: 8px; margin-left: 8px; }

    /* Level bars compact */
    .level-bars { list-style: none; font-size: 11px; }
    .level-bar-item { display: flex; align-items: center; gap: 6px; padding: 2px 0; }
    .level-label { font-family: monospace; font-weight: 600; width: 40px; text-align: right; font-size: 10px; }
    .level-bar-track { flex: 1; height: 12px; background: #21262d; border-radius: 3px; overflow: hidden; }
    .level-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s ease; }
    .level-count { font-size: 10px; color: #8b949e; width: 36px; }

    .empty-state { text-align: center; padding: 40px 20px; color: #484f58; }
    .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
    .hidden { display: none !important; }

    @media (max-width: 860px) {
      .main-layout { flex-direction: column; }
      .charts-column { flex: none; width: 100%; }
    }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <h1>Java 日志分析</h1>
      <div class="subtitle">解析 ERROR / 异常堆栈 · 链路追踪 · 勾选 AI 问答</div>
    </div>
  </div>

  <!-- Upload -->
  <div id="uploadArea" class="upload-area">
    <div class="grow">
      <div class="text" id="uploadText">📄 选择或拖入 Java 日志（.log / .txt）</div>
      <div class="hint" id="fileName">支持 Logback / Log4j 文本</div>
    </div>
    <button type="button" class="upload-btn btn-blue" id="pickBtn">选择文件</button>
    <button type="button" class="upload-btn btn-green" id="aiAnalyzeBtn" disabled>AI 分析异常</button>
    <input type="file" id="fileInput" accept=".log,.txt,.out,text/plain" />
  </div>

  <!-- Dashboard -->
  <div id="dashboard" class="hidden">
    <!-- Summary Cards -->
    <div class="summary-cards">
      <div class="card">
        <div class="label">总条目</div>
        <div class="value info" id="totalCount">—</div>
        <div class="extra" id="timeRange"></div>
      </div>
      <div class="card">
        <div class="label">ERROR</div>
        <div class="value error" id="errorCount">—</div>
        <div class="extra" id="errorPct"></div>
      </div>
      <div class="card">
        <div class="label">WARN</div>
        <div class="value warn" id="warnCount">—</div>
        <div class="extra" id="warnPct"></div>
      </div>
      <div class="card">
        <div class="label">异常种类</div>
        <div class="value error" id="exceptionTypes">—</div>
        <div class="extra" id="exceptionTotal"></div>
      </div>
      <div class="card">
        <div class="label">时间跨度</div>
        <div class="value success" id="duration">—</div>
        <div class="extra" id="durationDetail"></div>
      </div>
      <div class="card">
        <div class="label">链路数</div>
        <div class="value info" id="traceCount">—</div>
        <div class="extra" id="traceDetail"></div>
      </div>
    </div>

    <!-- AI Report Panel -->
    <div id="aiPanel" class="ai-panel hidden">
      <h3>AI 异常分析 <span class="badge" id="aiSourceBadge"></span></h3>
      <div id="aiStatus"></div>
      <div id="aiReport"></div>
    </div>

    <!-- Main Layout: Charts (small) + Log (big) -->
    <div class="main-layout">
      <!-- Left: Charts Column (narrow) -->
      <div class="charts-column">
        <!-- Error Timeline -->
        <div class="panel">
          <h3>错误频率 <span class="badge">按分钟</span></h3>
          <div class="chart-sm"><canvas id="timelineChart"></canvas></div>
        </div>
        <!-- Level Distribution -->
        <div class="panel">
          <h3>日志级别</h3>
          <ul class="level-bars" id="levelBars"></ul>
        </div>
        <!-- Top Exceptions -->
        <div class="panel">
          <h3>Top 异常 <span class="badge" id="exceptionBadge"></span></h3>
          <ul class="exception-list" id="exceptionList"></ul>
        </div>
        <!-- Thread Distribution -->
        <div class="panel">
          <h3>线程分布</h3>
          <div class="chart-xs"><canvas id="threadChart"></canvas></div>
        </div>
      </div>

      <!-- Right: Log Column (big) -->
      <div class="log-column">
        <!-- Trace View -->
        <div class="panel trace-panel">
          <h3>链路追踪 <span class="badge" id="traceBadge"></span></h3>
          <select id="traceSelect"><option value="">— 选择链路 —</option></select>
          <div class="trace-view" id="traceView"></div>
        </div>

        <!-- AI Chat -->
        <div class="chat-panel">
          <div class="chat-toolbar">
            <span class="sel-count" id="selCount">已选 0 条</span>
            <button type="button" class="upload-btn btn-orange" id="clearSelBtn" style="font-size:11px;padding:3px 8px;">取消选择</button>
            <input type="text" id="chatQuestion" placeholder="针对勾选的日志提问…" />
            <button type="button" class="upload-btn btn-green" id="chatAskBtn" disabled>问答</button>
          </div>
          <div id="chatAnswer"></div>
        </div>

        <!-- Raw Log Viewer -->
        <div class="panel" style="border-color:#30363d;">
          <h3>原始日志浏览 <span class="badge" id="logBadge"></span>
            <button type="button" class="upload-btn btn-blue" id="refreshBtn" style="font-size:11px;padding:2px 8px;margin-left:auto;">刷新</button>
          </h3>
          <div class="log-controls">
            <input type="text" class="search-input" id="logSearch" placeholder="搜索关键字…" />
            <select id="logLevelFilter">
              <option value="">全部</option>
              <option value="TRACE">TRACE</option>
              <option value="DEBUG">DEBUG</option>
              <option value="INFO">INFO</option>
              <option value="WARN">WARN</option>
              <option value="ERROR">ERROR</option>
              <option value="FATAL">FATAL</option>
            </select>
            <label style="font-size:11px;color:#8b949e;display:flex;align-items:center;gap:4px;">
              <input type="checkbox" id="traceOnly" /> 仅带链路
            </label>
          </div>
          <div class="log-viewer" id="logViewer"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Empty State -->
  <div id="emptyState" class="empty-state hidden">
    <div class="icon">&#128270;</div>
    <div class="text">未解析到有效日志行。请确认是 Java 服务文本日志（含时间戳、级别、[线程]、Logger）。</div>
  </div>

  <script>
    // ================================================================
    // 全局变量
    // ================================================================
    let parsedEntries = [];
    let lastStats = null;
    let lastFileName = '';
    let timelineChartInstance = null;
    let threadChartInstance = null;
    let searchTimer = null;

    // ================================================================
    // 日志解析（前端版）
    // ================================================================
    const TS = '(\\d{4}-\\d{2}-\\d{2}[\\sT]\\d{2}:\\d{2}:\\d{2}(?:[.,]\\d{1,3})?)';
    const LEVEL = '(TRACE|DEBUG|INFO|WARN|ERROR|FATAL)';
    const THREAD = '\\[([^\\]]+)\\]';
    const LOGGER = '(\\S+?)(?::\\s*(\\d+))?(?:\\s+\\[[^\\]]+\\])*';
    const MSG = '(.*)';
    const PATTERNS = [
      new RegExp('^' + TS + '\\s+' + THREAD + '\\s+' + LEVEL + '\\s+' + LOGGER + '\\s*-\\s*' + MSG + '$'),
      new RegExp('^' + TS + '\\s+' + LEVEL + '\\s+' + THREAD + '\\s+' + LOGGER + '\\s*-\\s*' + MSG + '$'),
    ];
    const TRACE_RE = /\[?(?:trace(?:_id)?|traceId)\s*[=:]\s*([a-f0-9]{16,32})(?:[,\s]+\s*(?:span(?:_id)?|spanId)\s*[=:]\s*([a-f0-9]{16}))?/i;
    const THREAD_PATTERNS = [
      { re: /^xxl-job/i, type: 'xxl-job' },
      { re: /^pool-\d+-thread-\d+$/, type: 'pool-thread' },
      { re: /^wr-org-\d+/, type: 'worker-thread' },
      { re: /^http-nio/i, type: 'http-nio' },
      { re: /^main$/, type: 'main' },
      { re: /^scheduling-\d+/i, type: 'scheduler' },
      { re: /^@Async|task-\d+/i, type: 'async' },
    ];

    function classifyThread(thread) {
      for (const p of THREAD_PATTERNS) { if (p.re.test(thread)) return p.type; }
      return 'unknown';
    }

    function detectException(line) {
      const caused = /^Caused by:\s+([\w.$]+)(?::\s*(.*))?$/.exec(line.trim());
      if (caused) return { className: caused[1], message: caused[2] || null };
      const nested = /(?:^|[\s;])(?:nested\s+)?exception\s+is\s+([\w.$]+(?:Exception|Error))(?::\s*(.*))?/i.exec(line.trim());
      if (nested) return { className: nested[1], message: nested[2] || null };
      const top = /^([\w.$]+(?:Exception|Error))(?::\s*(.*))?$/.exec(line.trim());
      if (top) return { className: top[1], message: top[2] || null };
      const inline = /(?:^|[\s;:])((?:[a-z][a-z0-9_]*\.)+[A-Z][\w$]*(?:Exception|Error)|[A-Z][\w$]*(?:Exception|Error))(?::\s*([^\n]*))?/.exec(line.trim());
      if (inline) return { className: inline[1], message: inline[2] || null };
      return null;
    }

    function applyExc(cur, text) {
      const d = detectException(text);
      if (!d) return;
      cur.isException = true;
      if (!cur.exceptionClass) { cur.exceptionClass = d.className; cur.exceptionMessage = d.message; }
    }

    function extractTrace(line) {
      const m = TRACE_RE.exec(line);
      return m ? { traceId: m[1], spanId: m[2] || null } : { traceId: null, spanId: null };
    }

    function matchLine(line) {
      for (let i = 0; i < PATTERNS.length; i++) {
        const m = PATTERNS[i].exec(line);
        if (m) return { m, kind: i };
      }
      return null;
    }

    function parseLog(raw) {
      const lines = raw.split(/\r?\n/);
      const entries = [];
      let cur = null;
      for (const line of lines) {
        const hit = matchLine(line);
        if (hit) {
          if (cur) entries.push(cur);
          const { m, kind } = hit;
          const timestamp = m[1];
          const thread = kind === 1 ? m[3] : m[2];
          const level = kind === 1 ? m[2] : m[3];
          const logger = m[4]; const lineNo = m[5] || ''; const message = m[6];
          const traceIds = extractTrace(line);
          cur = {
            timestamp, thread, level, logger, lineNo, message,
            fullMessage: line, threadType: classifyThread(thread),
            isException: false, exceptionClass: null, exceptionMessage: null,
            traceId: traceIds.traceId, spanId: traceIds.spanId,
          };
          applyExc(cur, message);
          continue;
        }
        if (cur) {
          cur.fullMessage += '\n' + line;
          if (/^\s+at\s+/.test(line) || /^\s*\.\.\.\s+\d+\s+more/.test(line)) cur.isException = true;
          applyExc(cur, line);
        }
      }
      if (cur) entries.push(cur);
      return entries;
    }

    // ================================================================
    // 分析
    // ================================================================
    function analyze(entries) {
      const levels = {}; const threads = {}; const excMap = new Map();
      const errorTimeline = new Map(); const traceSet = new Set();
      let startDate = null, endDate = null;
      for (const e of entries) {
        levels[e.level] = (levels[e.level] || 0) + 1;
        threads[e.threadType] = (threads[e.threadType] || 0) + 1;
        if (e.exceptionClass) {
          const ex = excMap.get(e.exceptionClass) || { count: 0, sample: e.exceptionMessage || e.message };
          ex.count++; excMap.set(e.exceptionClass, ex);
        }
        if (e.traceId) traceSet.add(e.traceId);
        if (e.level === 'ERROR' || e.level === 'FATAL') {
          try {
            const d = new Date(e.timestamp.replace(' ', 'T'));
            if (!isNaN(d)) {
              const min = d.toISOString().slice(0, 16);
              errorTimeline.set(min, (errorTimeline.get(min) || 0) + 1);
            }
            if (!startDate || d < startDate) startDate = d;
            if (!endDate || d > endDate) endDate = d;
          } catch {}
        }
        try {
          const d = new Date(e.timestamp.replace(' ', 'T'));
          if (!isNaN(d)) { if (!startDate || d < startDate) startDate = d; if (!endDate || d > endDate) endDate = d; }
        } catch {}
      }
      const topExceptions = [...excMap.entries()].map(([cls, { count, sample }]) => ({ className: cls, count, sample })).sort((a, b) => b.count - a.count).slice(0, 20);
      const timeline = [...errorTimeline.entries()].map(([minute, count]) => ({ minute, count })).sort((a, b) => a.minute.localeCompare(b.minute));
      const durationMs = startDate && endDate ? endDate - startDate : null;
      return { total: entries.length, levels, threads, topExceptions, timeline, durationMs, startDate, endDate, traceCount: traceSet.size };
    }

    // ================================================================
    // 渲染
    // ================================================================
    function renderDashboard(entries) {
      const stats = analyze(entries);
      if (stats.total === 0) {
        document.getElementById('dashboard').classList.add('hidden');
        document.getElementById('emptyState').classList.remove('hidden');
        return;
      }
      document.getElementById('dashboard').classList.remove('hidden');
      document.getElementById('emptyState').classList.add('hidden');

      // Summary
      document.getElementById('totalCount').textContent = stats.total.toLocaleString();
      const errCount = (stats.levels['ERROR'] || 0) + (stats.levels['FATAL'] || 0);
      document.getElementById('errorCount').textContent = errCount.toLocaleString();
      document.getElementById('errorPct').textContent = stats.total > 0 ? `${((errCount / stats.total) * 100).toFixed(1)}%` : '';
      const warnCount = stats.levels['WARN'] || 0;
      document.getElementById('warnCount').textContent = warnCount.toLocaleString();
      document.getElementById('warnPct').textContent = stats.total > 0 ? `${((warnCount / stats.total) * 100).toFixed(1)}%` : '';
      document.getElementById('exceptionTypes').textContent = stats.topExceptions.length;
      document.getElementById('exceptionTotal').textContent = `共 ${stats.topExceptions.reduce((s, e) => s + e.count, 0)} 次`;
      document.getElementById('traceCount').textContent = stats.traceCount;
      document.getElementById('traceDetail').textContent = stats.traceCount > 0 ? `可展开链路分析` : '未检测到 traceId';
      if (stats.durationMs !== null) {
        const mins = Math.round(stats.durationMs / 60000);
        document.getElementById('duration').textContent = mins < 60 ? `${mins} 分钟` : `${(mins / 60).toFixed(1)} 小时`;
        document.getElementById('durationDetail').textContent = `${stats.startDate.toISOString().slice(0, 19)} → ${stats.endDate.toISOString().slice(0, 19)}`;
      }
      if (stats.startDate && stats.endDate) {
        document.getElementById('timeRange').textContent = `${stats.startDate.toISOString().slice(0, 16)} → ${stats.endDate.toISOString().slice(0, 16)}`;
      }

      // Timeline chart
      if (timelineChartInstance) timelineChartInstance.destroy();
      const tlCtx = document.getElementById('timelineChart').getContext('2d');
      timelineChartInstance = new Chart(tlCtx, {
        type: 'bar',
        data: {
          labels: stats.timeline.map(t => t.minute.slice(11)),
          datasets: [{ label: 'ERROR', data: stats.timeline.map(t => t.count), backgroundColor: '#f8514966', borderColor: '#f85149', borderWidth: 1, borderRadius: 3 }],
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: { x: { ticks: { color: '#8b949e', maxRotation: 45, font: { size: 9 } }, grid: { color: '#21262d' } }, y: { ticks: { color: '#8b949e', font: { size: 9 } }, grid: { color: '#21262d' }, beginAtZero: true } },
        },
      });

      // Level bars
      const levelColors = { TRACE: '#484f58', DEBUG: '#7ee787', INFO: '#58a6ff', WARN: '#d29922', ERROR: '#f85149', FATAL: '#da3633' };
      const levelBars = document.getElementById('levelBars');
      levelBars.innerHTML = '';
      const maxLevel = Math.max(...Object.values(stats.levels));
      for (const [level, count] of Object.entries(stats.levels).sort((a, b) => b[1] - a[1])) {
        const pct = maxLevel > 0 ? (count / maxLevel) * 100 : 0;
        const realPct = stats.total > 0 ? ((count / stats.total) * 100).toFixed(1) : 0;
        levelBars.innerHTML += `<li class="level-bar-item"><span class="level-label" style="color:${levelColors[level]||'#8b949e'}">${level}</span><div class="level-bar-track"><div class="level-bar-fill" style="width:${pct}%;background:${levelColors[level]||'#8b949e'}"></div></div><span class="level-count">${count.toLocaleString()}</span></li>`;
      }

      // Exceptions
      document.getElementById('exceptionBadge').textContent = `${stats.topExceptions.length} 种`;
      const excList = document.getElementById('exceptionList');
      excList.innerHTML = '';
      for (const exc of stats.topExceptions.slice(0, 10)) {
        excList.innerHTML += `<li class="exception-item"><div><div class="class-name">${escHtml(exc.className)}</div></div><span class="count-badge">${exc.count}</span></li>`;
      }

      // Thread doughnut
      if (threadChartInstance) threadChartInstance.destroy();
      const thCtx = document.getElementById('threadChart').getContext('2d');
      const threadEntries = Object.entries(stats.threads).sort((a, b) => b[1] - a[1]);
      const threadColors = ['#58a6ff','#3fb950','#d29922','#f85149','#bc8cff','#79c0ff','#8b949e'];
      threadChartInstance = new Chart(thCtx, {
        type: 'doughnut',
        data: { labels: threadEntries.map(([t]) => t), datasets: [{ data: threadEntries.map(([,c]) => c), backgroundColor: threadColors.slice(0, threadEntries.length), borderColor: '#161b22', borderWidth: 2 }] },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right', labels: { color: '#c9d1d9', padding: 8, font: { size: 10 } } } } },
      });

      // Trace select
      buildTraceSelect(entries);
      document.getElementById('traceBadge').textContent = stats.traceCount > 0 ? `${stats.traceCount} 条链路` : '未检测到';

      // Log viewer
      renderLogViewer(entries);
      document.getElementById('logBadge').textContent = `${entries.length} 行`;

      lastStats = stats;
      document.getElementById('aiAnalyzeBtn').disabled = false;
      document.getElementById('aiPanel').classList.add('hidden');
      updateSelCount();
    }

    // ================================================================
    // 链路追踪
    // ================================================================
    function buildTraceSelect(entries) {
      const traceMap = new Map();
      for (const e of entries) {
        if (e.traceId) {
          if (!traceMap.has(e.traceId)) traceMap.set(e.traceId, []);
          traceMap.get(e.traceId).push(e);
        }
      }
      const sel = document.getElementById('traceSelect');
      sel.innerHTML = '<option value="">— 选择链路 —</option>';
      for (const [traceId, group] of traceMap) {
        const g = group.sort((a, b) => a.timestamp.localeCompare(b.timestamp));
        const hasError = g.some(e => e.level === 'ERROR' || e.level === 'FATAL');
        const label = `${traceId.slice(0, 12)}… ${g.length}条${hasError ? ' ⚠️' : ''}  ${g[0].timestamp.slice(11, 19)}→${g[g.length-1].timestamp.slice(11, 19)}`;
        const opt = document.createElement('option');
        opt.value = traceId;
        opt.textContent = label;
        sel.appendChild(opt);
      }
      document.getElementById('traceView').style.display = 'none';
    }

    function showTrace(traceId) {
      const view = document.getElementById('traceView');
      if (!traceId) { view.style.display = 'none'; return; }
      const group = parsedEntries.filter(e => e.traceId === traceId).sort((a, b) => a.timestamp.localeCompare(b.timestamp));
      if (group.length === 0) { view.style.display = 'none'; return; }
      let html = `<div style="color:#58a6ff;margin-bottom:4px;">Trace: ${traceId}</div>`;
      const colors = { TRACE:'#484f58', DEBUG:'#7ee787', INFO:'#58a6ff', WARN:'#d29922', ERROR:'#f85149', FATAL:'#da3633' };
      for (const e of group) {
        const c = colors[e.level] || '#8b949e';
        const tag = e.spanId ? ` span:${e.spanId.slice(0,8)}` : '';
        html += `<div style="color:${c}">${e.timestamp.slice(11)} [${e.level}] ${escHtml(e.logger)} - ${escHtml(e.message.slice(0,120))}${tag}</div>`;
      }
      view.innerHTML = html;
      view.style.display = 'block';
    }

    // ================================================================
    // 原始日志渲染（含勾选框）
    // ================================================================
    function renderLogViewer(entries) {
      const keyword = document.getElementById('logSearch').value.toLowerCase();
      const levelFilter = document.getElementById('logLevelFilter').value;
      const traceOnly = document.getElementById('traceOnly').checked;

      let html = '';
      for (let i = 0; i < entries.length; i++) {
        const e = entries[i];
        if (levelFilter && e.level !== levelFilter) continue;
        if (keyword && !e.fullMessage.toLowerCase().includes(keyword)) continue;
        if (traceOnly && !e.traceId) continue;

        const selected = e._selected ? ' selected' : '';
        const traceTag = e.traceId ? ` <span class="trace-tag" data-trace="${escHtml(e.traceId)}">🔗</span>` : '';
        html += `<div class="log-line${selected}" data-idx="${i}">` +
          `<span class="cb"><input type="checkbox" data-idx="${i}" ${e._selected ? 'checked' : ''} /></span>` +
          `<span class="content">` +
          `<span class="ts">${escHtml(e.timestamp)}</span> ` +
          `[<span class="thread">${escHtml(e.thread)}</span>] ` +
          `<span class="level-${e.level}">${e.level}</span> ` +
          `<span class="logger">${escHtml(e.logger)}</span> - ` +
          `<span class="msg">${escHtml(e.message)}</span>${traceTag}` +
          `</span></div>`;

        // Stacktrace lines (max 3 for compactness)
        const extraLines = e.fullMessage.split('\n').slice(1, 4);
        for (const sl of extraLines) {
          if (sl.trim()) {
            html += `<div class="log-line stacktrace" data-idx="${i}"><span class="cb"></span><span class="content">${escHtml(sl)}</span></div>`;
          }
        }
      }
      document.getElementById('logViewer').innerHTML = html || '<div style="color:#484f58;text-align:center;padding:16px">无匹配日志</div>';

      // Bind checkbox events
      document.querySelectorAll('#logViewer input[type="checkbox"]').forEach(cb => {
        cb.addEventListener('change', function() {
          const idx = parseInt(this.dataset.idx);
          if (!isNaN(idx) && parsedEntries[idx]) {
            parsedEntries[idx]._selected = this.checked;
            // Update visual
            const line = this.closest('.log-line');
            if (line) line.classList.toggle('selected', this.checked);
            updateSelCount();
          }
        });
      });

      // Trace tag click
      document.querySelectorAll('.trace-tag').forEach(el => {
        el.addEventListener('click', function() {
          const traceId = this.dataset.trace;
          if (traceId) {
            document.getElementById('traceSelect').value = traceId;
            showTrace(traceId);
          }
        });
      });
    }

    function updateSelCount() {
      const count = parsedEntries.filter(e => e._selected).length;
      document.getElementById('selCount').textContent = `已选 ${count} 条`;
      document.getElementById('chatAskBtn').disabled = count === 0;
    }

    // ================================================================
    // AI 异常分析
    // ================================================================
    function collectExceptionSamples(entries, topExceptions) {
      const wanted = new Set((topExceptions || []).slice(0, 5).map(e => e.className));
      const samples = [];
      for (const e of entries) {
        if (!e.exceptionClass || !wanted.has(e.exceptionClass)) continue;
        samples.push(e.fullMessage.split('\n').slice(0, 12).join('\n'));
        if (samples.length >= 6) break;
      }
      return samples;
    }

    async function runAiAnalyze() {
      if (!lastStats || !parsedEntries.length) return;
      const panel = document.getElementById('aiPanel');
      const status = document.getElementById('aiStatus');
      const reportEl = document.getElementById('aiReport');
      const badge = document.getElementById('aiSourceBadge');
      const btn = document.getElementById('aiAnalyzeBtn');
      panel.classList.remove('hidden');
      badge.textContent = ''; badge.className = 'badge';
      status.textContent = '正在调用 AI 分析异常，请稍候…';
      reportEl.textContent = ''; btn.disabled = true;

      const errCount = (lastStats.levels['ERROR'] || 0) + (lastStats.levels['FATAL'] || 0);
      const payload = { fileName: lastFileName, totalEntries: lastStats.total, errorCount: errCount, topExceptions: lastStats.topExceptions.slice(0, 10), samples: collectExceptionSamples(parsedEntries, lastStats.topExceptions) };
      try {
        const res = await fetch('/log-viewer/api/ai-analyze', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
        badge.textContent = data.source === 'llm' ? '大模型' : '规则兜底';
        badge.className = 'badge ' + (data.source === 'llm' ? 'llm' : 'rules');
        status.textContent = data.source === 'llm' ? '分析完成' : '分析完成（规则研判）';
        reportEl.textContent = data.report || '';
      } catch (err) {
        status.textContent = '分析失败：' + (err.message || String(err));
      } finally { btn.disabled = false; }
    }

    // ================================================================
    // AI 问答（勾选日志）
    // ================================================================
    async function runAiChat() {
      const selected = parsedEntries.filter(e => e._selected);
      if (selected.length === 0) return;
      const question = document.getElementById('chatQuestion').value.trim();
      if (!question) return;

      const answerEl = document.getElementById('chatAnswer');
      answerEl.style.display = 'block';
      answerEl.textContent = '正在分析…';
      document.getElementById('chatAskBtn').disabled = true;

      const lines = selected.map(e => `[${e.timestamp}] [${e.level}] [${e.thread}] ${e.logger} - ${e.message}`);
      try {
        const res = await fetch('/log-viewer/api/ai-chat', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ selectedLines: lines, question, fileName: lastFileName, totalEntries: parsedEntries.length }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
        answerEl.textContent = data.answer || '(空)';
      } catch (err) {
        answerEl.textContent = '问答失败：' + (err.message || String(err));
      } finally { document.getElementById('chatAskBtn').disabled = false; }
    }

    // ================================================================
    // 文件加载
    // ================================================================
    function loadFile(file) {
      lastFileName = file.name;
      document.getElementById('uploadText').textContent = file.name;
      document.getElementById('fileName').textContent = `${(file.size / 1024 / 1024).toFixed(2)} MB — 解析中…`;
      document.getElementById('dashboard').classList.add('hidden');
      document.getElementById('emptyState').classList.add('hidden');
      document.getElementById('aiAnalyzeBtn').disabled = true;
      const reader = new FileReader();
      reader.onload = function (e) {
        setTimeout(() => {
          parsedEntries = parseLog(e.target.result);
          document.getElementById('fileName').textContent = `${(file.size / 1024 / 1024).toFixed(2)} MB · 解析中…`;
          renderDashboard(parsedEntries);
          if (parsedEntries.length > 0) {
            document.getElementById('fileName').textContent = `${(file.size / 1024 / 1024).toFixed(2)} MB · ${parsedEntries.length.toLocaleString()} 条`;
          }
        }, 0);
      };
      reader.readAsText(file);
    }

    // ================================================================
    // 工具
    // ================================================================
    function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    // ================================================================
    // 事件绑定
    // ================================================================
    const uploadArea = document.getElementById('uploadArea');
    const fileInput = document.getElementById('fileInput');

    document.getElementById('pickBtn').addEventListener('click', (e) => { e.stopPropagation(); fileInput.click(); });
    uploadArea.addEventListener('click', (e) => { if (e.target.id === 'aiAnalyzeBtn' || e.target.id === 'pickBtn') return; fileInput.click(); });
    fileInput.addEventListener('change', (e) => { if (e.target.files[0]) loadFile(e.target.files[0]); });
    uploadArea.addEventListener('dragover', (e) => { e.preventDefault(); uploadArea.classList.add('dragover'); });
    uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('dragover'));
    uploadArea.addEventListener('drop', (e) => { e.preventDefault(); uploadArea.classList.remove('dragover'); if (e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]); });
    document.getElementById('aiAnalyzeBtn').addEventListener('click', (e) => { e.stopPropagation(); runAiAnalyze(); });

    // Trace select
    document.getElementById('traceSelect').addEventListener('change', function() { showTrace(this.value); });

    // Chat
    document.getElementById('chatAskBtn').addEventListener('click', runAiChat);
    document.getElementById('chatQuestion').addEventListener('keydown', function(e) { if (e.key === 'Enter') runAiChat(); });
    document.getElementById('clearSelBtn').addEventListener('click', function() {
      for (const e of parsedEntries) e._selected = false;
      renderLogViewer(parsedEntries);
      updateSelCount();
    });

    // Log viewer controls (debounced search)
    function debouncedRender() {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => renderLogViewer(parsedEntries), 200);
    }
    document.getElementById('logSearch').addEventListener('input', debouncedRender);
    document.getElementById('logLevelFilter').addEventListener('change', () => renderLogViewer(parsedEntries));
    document.getElementById('traceOnly').addEventListener('change', () => renderLogViewer(parsedEntries));
    document.getElementById('refreshBtn').addEventListener('click', () => renderLogViewer(parsedEntries));
  </script>
</body>
</html>
